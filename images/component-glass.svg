 570q-90 0 -140 -34M324 570q90 0 140 -34" fill="none" stroke="#1C6CA8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="312" y="592" font-size="12.5" fill="#2B3A48" fill-opacity="0.85" text-anchor="middle">Opening direction (illustrative)</text><path d="M200 240L122 112" stroke="#1C6CA8" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/><circle cx="200" cy="240" r="3.4" fill="#1C6CA8"/><text x="66" y="106" font-size="12.5" fill="#2B3A48" fill-opacity="0.85" text-anchor="start">Glazed leaf</text><path d="M100 420L62 468" stroke="#1C6CA8" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/><circle cx="100" cy="420" r="3.4" fill="#1C6CA8"/><text x="56" y="488" font-size="12.5" fill="#2B3A48" fill-opacity="0.85" text-anchor="start">Frame stile</text><rect x="596" y="128" width="266" height="206" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C6CA8" stroke-opacity="0.55" stroke-width="1.2"/><text x="608" y="148" font-size="11.5" letter-spacing="1.3" fill="#1C6CA8">DETAIL - GLASS IN FRAME</text><rect x="620" y="170" width="220" height="34" fill="url(#metv)" stroke="#13293D" stroke-width="1.4"/><rect x="640" y="210" width="180" height="70" fill="url(#glass)" stroke="#1C6CA8" stroke-width="2.4"/><rect x="632" y="200" width="196" height="12" rx="3" fill="#2E8BC9" fill-opacity="0.3" stroke="#1C6CA8" stroke-width="1.2"/><text x="620" y="306" font-size="12.5" fill="#2B3A48" fill-opacity="0.85" text-anchor="start">Glass seats into a channel with a</text><text x="620" y="324" font-size="12.5" fill="#2B3A48" fill-opacity="0.85" text-anchor="start">resilient gasket both faces.</text><rect x="596" y="356" width="266" height="186" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#1C6CA8" stroke-opacity="0.55" stroke-width="1.2"/><text x="608" y="376" font-size="11.5" letter-spacing="1.3" fill="#1C6CA8">GLAZING LOOKS</text><rect x="616" y="392" width="68" height="92" fill="#BBD6EA" fill-opacity="0.25" stroke="#1C6CA8" stroke-width="1.6"/><path d="M622 478L676 398" str